name: Build Windows PC (.exe) & Android (.apk)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # ম্যানুয়ালি GitHub থেকে এক ক্লিকে রান করার সুবিধা

jobs:
  build-windows-exe:
    name: Build Windows PC (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Package Windows .exe
        run: |
          ./gradlew :desktop:packageExe --stacktrace

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAFITV24-Windows-PC-Installer
          path: desktop/build/compose/binaries/main/exe/*

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release/Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAFITV24-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
